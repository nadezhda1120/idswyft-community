# ─────────────────────────────────────────────────
# Idswyft OCR engine only — stateless, no database
# ─────────────────────────────────────────────────
# Runs just the ML engine. Images are processed in memory and the result is
# returned as JSON; nothing is stored. No PostgreSQL, API or frontend.
#
#   docker compose -f docker-compose.ocr.yml up -d --build
#   curl -H "X-API-Key: $ENGINE_API_KEY" -F "file=@front.jpg" -F "issuing_country=BG" http://localhost:3002/extract/front
#   docker compose -f docker-compose.ocr.yml down
#
# Built from source so local changes (Bulgarian / Cyrillic support) are included.
# ─────────────────────────────────────────────────

services:
  engine:
    build:
      context: .
      dockerfile: engine/Dockerfile
      args:
        GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    image: idswyft-engine-bg:local
    restart: unless-stopped
    mem_limit: 2g
    environment:
      NODE_ENV: production
      PORT: "3002"
      LOG_LEVEL: info
      # Optional: require this key in the X-API-Key header on /extract/* (set it in .env)
      ENGINE_API_KEY: "${ENGINE_API_KEY:-}"
      # OCR models — all optional, see engine/src/config/ocrModels.ts
      OCR_CYRILLIC_ENABLED: "${OCR_CYRILLIC_ENABLED:-true}"
      OCR_DEFAULT_SCRIPT: "${OCR_DEFAULT_SCRIPT:-latin}"
      OCR_REC_MODEL: "${OCR_REC_MODEL:-}"
      OCR_REC_DICT: "${OCR_REC_DICT:-}"
      OCR_CYRILLIC_REC_MODEL: "${OCR_CYRILLIC_REC_MODEL:-}"
      OCR_CYRILLIC_REC_DICT: "${OCR_CYRILLIC_REC_DICT:-}"
      OCR_DET_MODEL: "${OCR_DET_MODEL:-}"
      # Text detection (engine/src/config/ocrModels.ts)
      OCR_DET_MAX_SIDE: "${OCR_DET_MAX_SIDE:-960}"
      OCR_DET_AUTO_DESKEW: "${OCR_DET_AUTO_DESKEW:-true}"
      # Image preprocessing before OCR (engine/src/services/imagePreprocess.ts)
      OCR_PREPROCESS: "${OCR_PREPROCESS:-true}"
      OCR_PREPROCESS_CROP: "${OCR_PREPROCESS_CROP:-true}"
      OCR_PREPROCESS_ENHANCE: "${OCR_PREPROCESS_ENHANCE:-auto}"
      OCR_PREPROCESS_MIN_SHORT_SIDE: "${OCR_PREPROCESS_MIN_SHORT_SIDE:-900}"
    ports:
      - "3002:3002"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
